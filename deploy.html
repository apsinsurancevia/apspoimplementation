<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaliberPO — Deployment Guide</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f0f4fa;
  color: #222;
  min-height: 100vh;
}

/* ── Header ──────────────────────────────────────────────────────────── */
.header {
  background: #1a1a2e;
  color: #fff;
  padding: 18px 32px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.header-logo { font-size: 20px; font-weight: 800; color: #4da6ff; letter-spacing: 1px; }
.header-sub  { font-size: 12px; color: #aac4e8; margin-top: 1px; }

.progress-info { font-size: 13px; color: #aac4e8; text-align: right; }
.progress-info strong { color: #fff; font-size: 16px; }

.progress-bar-track {
  height: 6px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #0066cc, #4da6ff);
  border-radius: 3px;
  transition: width 0.4s ease;
}

/* ── Layout ──────────────────────────────────────────────────────────── */
.layout {
  display: flex;
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 16px;
  gap: 24px;
}

/* ── Sidebar ─────────────────────────────────────────────────────────── */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  position: sticky;
  top: 88px;
  height: calc(100vh - 104px);
  overflow-y: auto;
}

.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

.phase-group { margin-bottom: 6px; }

.phase-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #0066cc;
  padding: 8px 12px 4px;
}

.sidebar-step {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: #444;
  transition: background 0.15s;
  text-decoration: none;
}

.sidebar-step:hover { background: #e8eef8; }
.sidebar-step.active { background: #e3f0ff; color: #0066cc; font-weight: 600; }
.sidebar-step.done   { color: #2e7d32; }
.sidebar-step.locked { color: #aaa; cursor: default; }

.step-dot {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid #d1d9e6;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
  flex-shrink: 0;
  color: #888;
  background: #fff;
}

.sidebar-step.done   .step-dot { background: #2e7d32; border-color: #2e7d32; color: #fff; }
.sidebar-step.active .step-dot { background: #0066cc; border-color: #0066cc; color: #fff; }

/* ── Main content ────────────────────────────────────────────────────── */
.main { flex: 1; min-width: 0; }

/* ── Step card ───────────────────────────────────────────────────────── */
.step-card {
  background: #fff;
  border-radius: 10px;
  border: 1.5px solid #e0e8f4;
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.step-card.active {
  border-color: #0066cc;
  box-shadow: 0 2px 16px rgba(0,102,204,0.1);
}

.step-card.done {
  border-color: #c8e6c9;
  background: #f9fff9;
}

.step-card.locked { opacity: 0.5; }

.step-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
}

.step-num {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: #f0f4fa;
  border: 2px solid #d1d9e6;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700;
  color: #555;
  flex-shrink: 0;
}

.step-card.active .step-num { background: #0066cc; border-color: #0066cc; color: #fff; }
.step-card.done   .step-num { background: #2e7d32; border-color: #2e7d32; color: #fff; }

.step-title-block { flex: 1; }

.step-phase-tag {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #0066cc;
  margin-bottom: 2px;
}

.step-title {
  font-size: 15px;
  font-weight: 700;
  color: #1a1a2e;
}

.step-card.done .step-title { color: #2e7d32; }

.step-status-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 12px;
  flex-shrink: 0;
}

.badge-done    { background: #e8f5e9; color: #2e7d32; }
.badge-active  { background: #e3f0ff; color: #0066cc; }
.badge-pending { background: #f3f3f3; color: #aaa; }

.step-body {
  padding: 0 18px 18px;
  display: none;
}

.step-card.active .step-body,
.step-card.done .step-body { display: block; }

.step-desc {
  font-size: 14px;
  color: #444;
  line-height: 1.6;
  margin-bottom: 14px;
}

/* ── Commands ────────────────────────────────────────────────────────── */
.cmd-block {
  background: #1a1a2e;
  border-radius: 7px;
  margin-bottom: 12px;
  overflow: hidden;
}

.cmd-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #4da6ff;
  padding: 8px 14px 4px;
}

.cmd-row {
  display: flex;
  align-items: center;
  padding: 4px 14px 8px;
  gap: 10px;
}

.cmd-text {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 13px;
  color: #e8f0fe;
  flex: 1;
  word-break: break-all;
}

.copy-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #aac4e8;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s;
}

.copy-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
.copy-btn.copied { color: #69f0ae; }

/* ── Note / Warning boxes ────────────────────────────────────────────── */
.note-box {
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 12px;
}

.note-info    { background: #e3f0ff; color: #004499; border-left: 3px solid #0066cc; }
.note-warning { background: #fff8e1; color: #7a4f00; border-left: 3px solid #f9a825; }
.note-success { background: #e8f5e9; color: #1b5e20; border-left: 3px solid #2e7d32; }

/* ── Sub-steps ───────────────────────────────────────────────────────── */
.substep-list { margin: 0 0 12px; padding: 0; list-style: none; }

.substep-list li {
  display: flex;
  gap: 10px;
  padding: 5px 0;
  font-size: 13px;
  color: #444;
  border-bottom: 1px solid #f0f4fa;
  line-height: 1.5;
}

.substep-list li:last-child { border-bottom: none; }

.substep-num {
  width: 20px; height: 20px;
  background: #e3f0ff;
  color: #0066cc;
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}

/* ── Action buttons ──────────────────────────────────────────────────── */
.step-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed #e0e8f4;
}

.btn-done {
  padding: 10px 22px;
  background: #0066cc;
  color: #fff;
  border: none;
  border-radius: 7px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-done:hover { background: #0052a3; }

.btn-undo {
  padding: 10px 18px;
  background: #fff;
  color: #666;
  border: 1.5px solid #d1d9e6;
  border-radius: 7px;
  font-size: 13px;
  cursor: pointer;
  transition: border-color 0.2s;
}

.btn-undo:hover { border-color: #0066cc; color: #0066cc; }

.step-card.done .btn-done { background: #2e7d32; }
.step-card.done .btn-done:hover { background: #1b5e20; }

/* ── Completion banner ───────────────────────────────────────────────── */
.complete-banner {
  display: none;
  background: #e8f5e9;
  border: 2px solid #2e7d32;
  border-radius: 10px;
  padding: 28px;
  text-align: center;
  margin-bottom: 24px;
}

.complete-banner.show { display: block; }
.complete-banner h2 { font-size: 22px; color: #1b5e20; margin-bottom: 8px; }
.complete-banner p  { font-size: 14px; color: #2e7d32; }

/* ── Reset button ────────────────────────────────────────────────────── */
.reset-btn {
  display: block;
  margin: 0 auto 24px;
  padding: 8px 20px;
  background: none;
  border: 1.5px solid #d1d9e6;
  border-radius: 6px;
  font-size: 12px;
  color: #888;
  cursor: pointer;
}

.reset-btn:hover { border-color: #e53e3e; color: #e53e3e; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-logo">CaliberPO</div>
      <div class="header-sub">Deployment Guide</div>
    </div>
    <div class="progress-info">
      <strong id="doneCount">0</strong> / <span id="totalCount">0</span> steps complete
    </div>
  </div>
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="layout">

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- Main -->
  <div class="main">
    <div class="complete-banner" id="completeBanner">
      <h2>Deployment Complete</h2>
      <p>CaliberPO is fully deployed and ready to use. Open the Rate Lookup web app URL to verify.</p>
    </div>
    <button class="reset-btn" onclick="resetAll()">Reset all progress</button>
    <div id="stepsContainer"></div>
  </div>

</div>

<script>
var STORAGE_KEY = 'caliber_deploy_progress';

var STEPS = [
  {
    phase: 'Prerequisites',
    title: 'Install Node.js',
    desc: 'Node.js is required to run clasp, the Google Apps Script deployment tool. Install version 18 or later.',
    commands: [{ label: 'Verify after install', cmd: 'node --version' }],
    note: { type: 'info', text: 'Download from nodejs.org. Choose the LTS version.' }
  },
  {
    phase: 'Prerequisites',
    title: 'Install clasp',
    desc: 'clasp is the command-line tool that pushes code from this repo to Google Apps Script.',
    commands: [
      { label: 'Install globally', cmd: 'npm install -g @google/clasp' },
      { label: 'Verify', cmd: 'clasp --version' }
    ]
  },
  {
    phase: 'Prerequisites',
    title: 'Install Python 3.9+',
    desc: 'Required for the invoice generator and statement template tools.',
    commands: [{ label: 'Verify after install', cmd: 'python --version' }],
    note: { type: 'info', text: 'Download from python.org. Ensure "Add to PATH" is checked during install.' }
  },
  {
    phase: 'Prerequisites',
    title: 'Install Python dependencies',
    desc: 'Install the libraries used by the Python invoice and template tools.',
    commands: [{ label: 'Install', cmd: 'pip install openpyxl pandas pdfplumber xlrd==1.2.0 pyxlsb' }]
  },
  {
    phase: 'Prerequisites',
    title: 'Enable Apps Script API',
    desc: 'clasp requires the Apps Script API to be enabled on the Google account used for this deployment.',
    substeps: [
      'Go to script.google.com/home/usersettings in the client\'s browser',
      'Toggle "Google Apps Script API" to ON'
    ],
    note: { type: 'warning', text: 'Must be done in the browser while signed in to the client\'s Google account.' }
  },
  {
    phase: 'Clone & Login',
    title: 'Clone the repository',
    desc: 'Clone the CaliberPO codebase to the deployment machine.',
    commands: [
      { label: 'Clone', cmd: 'git clone https://github.com/hrsrini/caliber-po.git caliber-po' },
      { label: 'Enter directory', cmd: 'cd caliber-po' }
    ]
  },
  {
    phase: 'Clone & Login',
    title: 'Log in to clasp',
    desc: 'Authenticate clasp with the client\'s Google account. A browser window will open.',
    commands: [{ label: 'Login', cmd: 'clasp login' }],
    note: { type: 'warning', text: 'Sign in with the Google account that will own the Apps Script projects.' }
  },
  {
    phase: 'Apps Script Projects',
    title: 'Create 5 Apps Script projects',
    desc: 'Go to script.google.com and create one new project for each of the following. Copy each Script ID from Project Settings (gear icon).',
    substeps: [
      'CaliberPO — Main  →  note the Script ID',
      'CaliberPO — GridEngine  →  note the Script ID',
      'CaliberPO — Rate API  →  note the Script ID',
      'CaliberPO — GridRun API  →  note the Script ID',
      'CaliberPO — Dashboard  →  note the Script ID'
    ],
    note: { type: 'info', text: 'Script ID is found under Project Settings → Script ID (gear icon in the editor).' }
  },
  {
    phase: 'Apps Script Projects',
    title: 'Update .clasp.json files',
    desc: 'Replace the scriptId in each file below with the Script ID you copied for that project. Leave rootDir unchanged.',
    substeps: [
      '.clasp.json  →  Script ID of CaliberPO — Main',
      'lib/src/.clasp.json  →  Script ID of CaliberPO — GridEngine',
      'api/rate/src/.clasp.json  →  Script ID of CaliberPO — Rate API',
      'api/gridrun/src/.clasp.json  →  Script ID of CaliberPO — GridRun API',
      'central/.clasp.json  →  Script ID of CaliberPO — Dashboard'
    ],
    note: { type: 'warning', text: 'Each .clasp.json must point to the correct project. Swapping IDs will push the wrong code to the wrong project.' }
  },
  {
    phase: 'Push Code',
    title: 'Push all 5 projects to Apps Script',
    desc: 'Run clasp push for each sub-project from the repo root. Each should end with "Pushed N files."',
    commands: [
      { label: 'Main pipeline', cmd: 'clasp push' },
      { label: 'GridEngine library', cmd: 'cd lib/src && clasp push && cd ../..' },
      { label: 'Rate API', cmd: 'cd api/rate/src && clasp push && cd ../../..' },
      { label: 'GridRun API', cmd: 'cd api/gridrun/src && clasp push && cd ../../..' },
      { label: 'Dashboard', cmd: 'cd central && clasp push && cd ..' }
    ]
  },
  {
    phase: 'Library Link',
    title: 'Link GridEngine as a library',
    desc: 'The main pipeline and Rate API depend on GridEngine. Link it manually in the Apps Script editor.',
    substeps: [
      'Open CaliberPO — GridEngine in the Apps Script editor',
      'Go to Settings (gear) → copy the Script ID',
      'Open CaliberPO — Main → click "+" next to Libraries',
      'Paste the Script ID → Add → select latest version → identifier: GridEngine → Save',
      'Repeat for CaliberPO — Rate API'
    ]
  },
  {
    phase: 'Script Properties',
    title: 'Set Script Properties — Main',
    desc: 'Add secret keys to the Main project. In the Apps Script editor: Project Settings → Script Properties → Add.',
    substeps: [
      'CLAUDE_API_KEY  →  Anthropic API key',
      'MONITORING_ENDPOINT  →  (optional, skip if not using monitoring)',
      'MONITORING_KEY  →  (optional, skip if not using monitoring)'
    ],
    note: { type: 'warning', text: 'Never put API keys in code or commit them to git. Script Properties only.' }
  },
  {
    phase: 'Script Properties',
    title: 'Set Script Properties — Rate API & GridRun API',
    desc: 'Add API keys to both API projects in their Script Properties.',
    substeps: [
      'Open CaliberPO — Rate API → Project Settings → Script Properties',
      'Add: RATE_API_KEY  →  any secret string you choose',
      'Open CaliberPO — GridRun API → Project Settings → Script Properties',
      'Add: GRID_RUN_API_KEY  →  any secret string you choose'
    ]
  },
  {
    phase: 'Web App Deploy',
    title: 'Deploy Web Apps',
    desc: 'Deploy the Main pipeline, Rate API, and GridRun API as Web Apps. Copy each URL — you will need the Rate API URL in Config.gs.',
    substeps: [
      'Open each project in the Apps Script editor',
      'Deploy → New deployment → Web App',
      'Execute as: Me  |  Access: Anyone',
      'Click Deploy → copy the URL',
      'Do this for: Main, Rate API, GridRun API'
    ],
    note: { type: 'info', text: 'The Main project URL is the Rate Lookup form users will open. Keep it safe.' }
  },
  {
    phase: 'Configuration',
    title: 'Fill Config.gs — broker identity',
    desc: 'Open src/Config.gs in the Apps Script editor (Main project) and fill in all blank fields.',
    substeps: [
      'BROKER_NAME, BROKER_LEGAL_NAME, BROKER_SHORT_CODE (2–4 letters)',
      'BROKER_GSTIN, BROKER_PAN, BROKER_STATE, BROKER_STATE_CODE',
      'BROKER_ADDRESS',
      'BROKER_BANK_NAME, BROKER_BANK_ACCOUNT, BROKER_BANK_IFSC, BROKER_BANK_BRANCH',
      'IRDAI_REG_NUMBER',
      'PARTNER_INVOICE_PREFIX, INSURER_INVOICE_PREFIX (e.g. "APS/PI/", "APS/II/")',
      'EMAIL_COORDINATOR, EMAIL_SENDER, EMAIL_FINANCE, EMAIL_RECON'
    ],
    note: { type: 'warning', text: 'BROKER_SHORT_CODE is used in all output file names. Use 2–4 uppercase letters.' }
  },
  {
    phase: 'Configuration',
    title: 'Push Config.gs',
    desc: 'After filling in Config.gs, push the updated file to Apps Script.',
    commands: [{ label: 'Push', cmd: 'clasp push' }]
  },
  {
    phase: 'Run Setup',
    title: 'Run runSetup()',
    desc: 'This creates all Drive folders and Google Sheets, then writes their IDs back into Config.gs automatically. Run once from the Apps Script editor.',
    substeps: [
      'Open CaliberPO — Main in the Apps Script editor',
      'Select function: runSetup',
      'Click Run',
      'Wait ~30 seconds for completion — check Execution Log for "Setup complete"'
    ],
    note: { type: 'info', text: 'runSetup() is safe to re-run if it fails partway through — it skips already-created resources.' }
  },
  {
    phase: 'Run Setup',
    title: 'Push again (Config IDs)',
    desc: 'runSetup() writes Drive and Sheet IDs back into Config.gs. Push again so those IDs are saved in the repo.',
    commands: [{ label: 'Push', cmd: 'clasp push' }]
  },
  {
    phase: 'Run Setup',
    title: 'Run seedDefaultPrompts()',
    desc: 'Populates the Prompts tab in CaliberPO Config with Claude extraction instructions for all 9 insurers.',
    substeps: [
      'In the Apps Script editor (Main project)',
      'Select function: seedDefaultPrompts',
      'Click Run'
    ]
  },
  {
    phase: 'Fill Data',
    title: 'Fill Insurer Master (Google Sheet)',
    desc: 'Open the Insurer Master Google Sheet created by runSetup() and fill in the insurer details.',
    substeps: [
      'Find "Insurer Master" in the CaliberPO Drive folder',
      'For each of the 9 insurers: fill insurer_gstin, insurer_state, insurer_state_code, insurer_address, spoc_email',
      'Leave insurer_id, insurer_name, sac_code, active as pre-filled'
    ]
  },
  {
    phase: 'Fill Data',
    title: 'Create and fill CaliberPO_Setup.xlsx',
    desc: 'Run the Python setup workbook creator, then fill the yellow cells.',
    commands: [{ label: 'Create setup workbook', cmd: 'python create_setup_workbook.py' }],
    substeps: [
      'Open the generated CaliberPO_Setup.xlsx',
      'Fill all yellow cells in the "Broker Setup" sheet',
      'Fill GSTIN, state code, address, SPOC email for each insurer in "Insurer Master" sheet'
    ]
  },
  {
    phase: 'Verify',
    title: 'Verify Rate Lookup form',
    desc: 'Open the Main Web App URL in a browser. The form should load with insurers and product types populated.',
    substeps: [
      'Open the Web App URL from Step 14 in a browser',
      'Form should show: insurer multi-select, product type dropdown',
      'Select an insurer and product — verify sub-types load',
      'If form is blank: check CLAUDE_API_KEY and Insurer Master are set'
    ],
    note: { type: 'success', text: 'If the form loads correctly, the deployment is working.' }
  },
  {
    phase: 'Verify',
    title: 'Upload a test grid and verify import',
    desc: 'Upload one insurer grid Excel to the Grid Import folder and run the import.',
    substeps: [
      'Upload a grid Excel file to the "Grid Import" folder in CaliberPO Drive',
      'In Apps Script editor, run: importGridsFromFolder()',
      'Check the Grids Google Sheet — new tabs should appear',
      'Run: validateAllGrids() to confirm no errors'
    ]
  }
];

// ── State ──────────────────────────────────────────────────────────────────────

var done = {};

function loadState() {
  try { done = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { done = {}; }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(done));
}

function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  done = {};
  saveState();
  render();
}

// ── Render ─────────────────────────────────────────────────────────────────────

function render() {
  var total     = STEPS.length;
  var doneCount = Object.keys(done).filter(function(k) { return done[k]; }).length;
  var pct       = total ? Math.round(doneCount / total * 100) : 0;

  document.getElementById('doneCount').textContent  = doneCount;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('progressFill').style.width = pct + '%';

  var completeBanner = document.getElementById('completeBanner');
  if (doneCount === total) completeBanner.classList.add('show');
  else completeBanner.classList.remove('show');

  renderSidebar();
  renderSteps();
}

function firstIncompleteIdx() {
  for (var i = 0; i < STEPS.length; i++) {
    if (!done[i]) return i;
  }
  return STEPS.length - 1;
}

function renderSidebar() {
  var sidebar = document.getElementById('sidebar');
  var activeIdx = firstIncompleteIdx();
  var lastPhase = '';
  var html = '';

  STEPS.forEach(function(step, i) {
    var isDone   = !!done[i];
    var isActive = !isDone && i === activeIdx;
    var isLocked = !isDone && i > activeIdx;
    var cls      = isDone ? 'done' : isActive ? 'active' : 'locked';

    if (step.phase !== lastPhase) {
      if (lastPhase) html += '</div>';
      html += '<div class="phase-group"><div class="phase-label">' + esc(step.phase) + '</div>';
      lastPhase = step.phase;
    }

    var dotContent = isDone ? '✓' : (i + 1);
    html += '<a class="sidebar-step ' + cls + '" onclick="scrollTo(' + i + ')">' +
      '<span class="step-dot">' + dotContent + '</span>' +
      '<span>' + esc(step.title) + '</span>' +
      '</a>';
  });
  if (lastPhase) html += '</div>';
  sidebar.innerHTML = html;
}

function renderSteps() {
  var container = document.getElementById('stepsContainer');
  var activeIdx = firstIncompleteIdx();
  var html      = '';

  STEPS.forEach(function(step, i) {
    var isDone   = !!done[i];
    var isActive = !isDone && i === activeIdx;
    var isLocked = !isDone && i > activeIdx;
    var cls = isDone ? 'done' : isActive ? 'active' : isLocked ? 'locked' : '';

    var badge     = isDone   ? '<span class="step-status-badge badge-done">Done</span>' :
                   isActive  ? '<span class="step-status-badge badge-active">Current</span>' :
                               '<span class="step-status-badge badge-pending">Pending</span>';

    html += '<div class="step-card ' + cls + '" id="step-' + i + '">';

    // Header
    html += '<div class="step-header" onclick="toggleStep(' + i + ')">';
    html += '<div class="step-num">' + (isDone ? '✓' : (i + 1)) + '</div>';
    html += '<div class="step-title-block">';
    html += '<div class="step-phase-tag">' + esc(step.phase) + '</div>';
    html += '<div class="step-title">' + esc(step.title) + '</div>';
    html += '</div>' + badge + '</div>';

    // Body
    html += '<div class="step-body">';
    html += '<p class="step-desc">' + esc(step.desc) + '</p>';

    if (step.note) {
      html += '<div class="note-box note-' + step.note.type + '">' + esc(step.note.text) + '</div>';
    }

    if (step.substeps) {
      html += '<ul class="substep-list">';
      step.substeps.forEach(function(s, si) {
        html += '<li><span class="substep-num">' + (si + 1) + '</span><span>' + esc(s) + '</span></li>';
      });
      html += '</ul>';
    }

    if (step.commands) {
      step.commands.forEach(function(c, ci) {
        var copyId = 'cmd-' + i + '-' + ci;
        html += '<div class="cmd-block">';
        html += '<div class="cmd-label">' + esc(c.label) + '</div>';
        html += '<div class="cmd-row">';
        html += '<span class="cmd-text" id="' + copyId + '">' + esc(c.cmd) + '</span>';
        html += '<button class="copy-btn" onclick="copyCmd(\'' + copyId + '\', this)">Copy</button>';
        html += '</div></div>';
      });
    }

    html += '<div class="step-actions">';
    if (isDone) {
      html += '<button class="btn-done" onclick="markDone(' + i + ')">Done</button>';
      html += '<button class="btn-undo" onclick="markUndo(' + i + ')">Undo</button>';
    } else if (!isLocked) {
      html += '<button class="btn-done" onclick="markDone(' + i + ')">Mark Complete</button>';
    }
    html += '</div>';

    html += '</div></div>';
  });

  container.innerHTML = html;
}

function toggleStep(i) {
  // Only active/done steps expand — locked stay closed
}

function markDone(i) {
  done[i] = true;
  saveState();
  render();
  // Scroll to next step
  var next = i + 1;
  if (next < STEPS.length) {
    setTimeout(function() { scrollTo(next); }, 150);
  }
}

function markUndo(i) {
  done[i] = false;
  // Also undo all steps after this one
  for (var j = i + 1; j < STEPS.length; j++) done[j] = false;
  saveState();
  render();
}

function scrollTo(i) {
  var el = document.getElementById('step-' + i);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyCmd(id, btn) {
  var el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(function() {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  });
}

function esc(str) {
  return (str || '').toString()
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Boot ───────────────────────────────────────────────────────────────────────

loadState();
render();
</script>
</body>
</html>
