<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaliberPO — Rate Lookup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f4fa;
    color: #222;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .container { max-width: 720px; margin: 0 auto; }

  .header {
    background: #1a1a2e;
    color: #fff;
    border-radius: 10px 10px 0 0;
    padding: 20px 28px;
  }

  .header-logo {
    font-size: 22px;
    font-weight: 800;
    color: #4da6ff;
    letter-spacing: 1px;
  }

  .header-sub {
    font-size: 13px;
    color: #aac4e8;
    margin-top: 2px;
  }

  .card {
    background: #fff;
    border-radius: 0 0 10px 10px;
    padding: 28px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .form-group.full-width { grid-column: 1 / -1; }

  label {
    font-size: 12px;
    font-weight: 600;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  label .req { color: #e53e3e; margin-left: 2px; }

  select, input[type="text"], input[type="number"], input[type="date"] {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid #d1d9e6;
    border-radius: 6px;
    font-size: 14px;
    color: #222;
    background: #fff;
    transition: border-color 0.2s;
  }

  select:focus, input:focus {
    outline: none;
    border-color: #0066cc;
    box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
  }

  .section-label {
    grid-column: 1 / -1;
    font-size: 11px;
    font-weight: 700;
    color: #0066cc;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: -6px;
    padding-top: 4px;
  }

  .section-divider {
    grid-column: 1 / -1;
    border: none;
    border-top: 1px dashed #d1d9e6;
    margin: 4px 0;
  }

  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1.5px solid #d1d9e6;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }

  .checkbox-group input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: #0066cc;
  }

  .checkbox-group span { font-size: 14px; color: #222; }

  .derived-value {
    padding: 9px 12px;
    border: 1.5px solid #e8f0fe;
    border-radius: 6px;
    background: #f0f4ff;
    font-size: 14px;
    color: #0066cc;
    font-weight: 600;
    min-height: 38px;
  }

  .hidden { display: none !important; }

  .btn-lookup {
    width: 100%;
    padding: 12px;
    background: #0066cc;
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 20px;
    transition: background 0.2s;
    letter-spacing: 0.5px;
  }

  .btn-lookup:hover    { background: #0052a3; }
  .btn-lookup:disabled { background: #99b8d9; cursor: not-allowed; }

  .result-panel {
    margin-top: 24px;
    border-radius: 8px;
    overflow: hidden;
    border: 1.5px solid #d1d9e6;
  }

  .result-header {
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .result-header.matched   { background: #e6f4ea; border-bottom: 2px solid #2e7d32; }
  .result-header.pan-india { background: #e3f0ff; border-bottom: 2px solid #0066cc; }
  .result-header.no-match  { background: #fdecea; border-bottom: 2px solid #c62828; }
  .result-header.error     { background: #fff3e0; border-bottom: 2px solid #e65100; }
  .result-header.duplicate { background: #fff8e1; border-bottom: 2px solid #f9a825; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .badge.exact   { background: #2e7d32; color: #fff; }
  .badge.pan     { background: #0066cc; color: #fff; }
  .badge.nomatch { background: #c62828; color: #fff; }
  .badge.error   { background: #e65100; color: #fff; }
  .badge.dup     { background: #f9a825; color: #fff; }

  .tier-badge {
    display: inline-block;
    padding: 2px 8px;
    background: #e3f0ff;
    color: #0066cc;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
  }

  .result-body { padding: 18px; background: #fff; }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .result-item { display: flex; flex-direction: column; gap: 2px; }
  .result-label { font-size: 11px; color: #777; font-weight: 600; text-transform: uppercase; }
  .result-value { font-size: 16px; font-weight: 700; color: #1a1a2e; }
  .result-value.amount { color: #0066cc; font-size: 18px; }
  .result-value.pi     { color: #666; font-size: 14px; }

  .result-notes {
    margin-top: 12px;
    padding: 10px 14px;
    background: #f8f8f8;
    border-radius: 6px;
    font-size: 13px;
    color: #555;
  }

  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 3px solid #d1d9e6;
    border-top-color: #0066cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-overlay {
    text-align: center;
    padding: 40px;
    color: #666;
    font-size: 14px;
  }

  /* ── Multi-select insurer widget ────────────────────────────────────────── */
  .multi-select-wrapper { position: relative; }

  .multi-select-trigger {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    border: 1.5px solid #d1d9e6;
    border-radius: 6px;
    font-size: 14px;
    color: #222;
    background: #fff;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.2s;
  }

  .multi-select-trigger:hover  { border-color: #0066cc; }
  .multi-select-trigger.open   { border-color: #0066cc; box-shadow: 0 0 0 3px rgba(0,102,204,0.1); }

  .ms-display   { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-display.placeholder { color: #888; }
  .ms-arrow     { font-size: 11px; color: #888; margin-left: 8px; transition: transform 0.15s; }
  .multi-select-trigger.open .ms-arrow { transform: rotate(180deg); }

  .multi-select-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: #fff;
    border: 1.5px solid #0066cc;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    z-index: 200;
    max-height: 230px;
    overflow-y: auto;
  }

  .ms-actions {
    display: flex;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid #e8eef8;
    font-size: 12px;
    position: sticky;
    top: 0;
    background: #f8faff;
  }

  .ms-actions a {
    color: #0066cc;
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
  }

  .ms-actions a:hover { text-decoration: underline; }

  .insurer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 14px;
    color: #222;
  }

  .insurer-row:hover { background: #f0f4ff; }

  .insurer-row input[type="checkbox"] {
    width: 15px; height: 15px;
    cursor: pointer;
    accent-color: #0066cc;
    flex-shrink: 0;
  }

  /* ── Comparison table ───────────────────────────────────────────────────── */
  .comparison-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .comparison-table th {
    background: #1a1a2e;
    color: #fff;
    padding: 9px 12px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .comparison-table td {
    padding: 9px 12px;
    border-bottom: 1px solid #e8eef8;
    vertical-align: middle;
  }

  .comparison-table tbody tr:last-child td { border-bottom: none; }
  .comparison-table tbody tr:hover td { background: #f5f8ff; }

  .rate-chip {
    display: inline-block;
    padding: 3px 9px;
    background: #e3f0ff;
    color: #0066cc;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 700;
  }

  .match-chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .match-chip.exact    { background: #2e7d32; color: #fff; }
  .match-chip.pan      { background: #0066cc; color: #fff; }
  .match-chip.no-match { background: #c62828; color: #fff; }
  .match-chip.err      { background: #e65100; color: #fff; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-logo">CaliberPO</div>
    <div class="header-sub">Commission Rate Lookup</div>
  </div>

  <div class="card">

    <div id="loadingState" class="loading-overlay">
      <span class="spinner"></span> Loading configuration...
    </div>

    <div id="mainForm" class="hidden">
      <div class="form-grid">

        <div class="section-label">Policy Details</div>

        <div class="form-group">
          <label>Insurer <span class="req">*</span></label>
          <div class="multi-select-wrapper" id="insurerWrapper">
            <div class="multi-select-trigger" id="insurerTrigger" onclick="toggleInsurerDropdown(event)">
              <span class="ms-display placeholder" id="insurerDisplay">— Select Insurer(s) —</span>
              <span class="ms-arrow">▾</span>
            </div>
            <div class="multi-select-dropdown hidden" id="insurerDropdown">
              <div class="ms-actions">
                <a onclick="selectAllInsurers()">All</a>
                <a onclick="clearInsurers()">Clear</a>
              </div>
              <div id="insurerCheckboxList"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Policy Issue Date <span class="req">*</span></label>
          <input type="date" id="policyIssueDate">
        </div>

        <div class="form-group">
          <label>Product Type <span class="req">*</span></label>
          <select id="productType">
            <option value="">— Select Product Type —</option>
          </select>
        </div>

        <div class="form-group" id="grpSubType">
          <label>Product Sub Type</label>
          <select id="productSubType" disabled>
            <option value="">Select Product Type first</option>
          </select>
        </div>

        <div class="form-group hidden" id="grpSubSubType">
          <label>Sub Sub Type</label>
          <select id="productSubSubType">
            <option value="">— All —</option>
          </select>
        </div>

        <hr class="section-divider">

        <div class="section-label">Vehicle Details</div>

        <div class="form-group">
          <label>RTO Code</label>
          <input type="text" id="rto" placeholder="e.g. MH-01">
        </div>

        <div class="form-group hidden" id="grpFuel">
          <label>Fuel Type</label>
          <select id="fuelType">
            <option value="">— All Fuel Types —</option>
          </select>
        </div>

        <div class="form-group hidden" id="grpCc">
          <label>Engine CC</label>
          <input type="number" id="vehicleCc" placeholder="e.g. 125">
        </div>

        <div class="form-group hidden" id="grpGvw">
          <label>GVW (tonnes)</label>
          <input type="number" id="vehicleGvw" placeholder="e.g. 7.5" step="0.1">
        </div>

        <div class="form-group hidden" id="grpSeating">
          <label>Seating Capacity</label>
          <input type="number" id="vehicleSeating" placeholder="e.g. 13">
        </div>

        <div class="form-group hidden" id="grpYom">
          <label>Year of Manufacture</label>
          <input type="number" id="yom" placeholder="e.g. 2022" min="1990" max="2030">
        </div>

        <div class="form-group hidden" id="grpVehicleAge">
          <label>Vehicle Age (derived)</label>
          <div class="derived-value" id="vehicleAgeDisplay">—</div>
        </div>

        <div class="form-group hidden" id="grpNilDep">
          <label>Nil Depreciation</label>
          <label class="checkbox-group">
            <input type="checkbox" id="nilDep">
            <span>Nil Dep applicable</span>
          </label>
        </div>

        <div class="form-group hidden" id="grpNcb">
          <label>No Claim Bonus</label>
          <label class="checkbox-group">
            <input type="checkbox" id="ncb">
            <span>NCB applicable</span>
          </label>
        </div>

      </div><!-- /form-grid -->

      <button class="btn-lookup" id="lookupBtn" onclick="doLookup()">Get Rate</button>

      <div class="result-panel hidden" id="resultPanel">
        <div class="result-header" id="resultHeader">
          <span class="badge" id="matchBadge"></span>
          <span id="matchLabel"></span>
          <span class="tier-badge hidden" id="tierBadge"></span>
        </div>
        <div class="result-body">
          <div class="result-grid" id="resultGrid"></div>
          <div class="result-notes hidden" id="resultNotes"></div>
        </div>
      </div>

    </div><!-- /mainForm -->
  </div><!-- /card -->
</div><!-- /container -->

<script>
var FORM_CONFIG = null;
var SELECTED_INSURER_IDS = {};

// ── Boot ──────────────────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', function() {

  // Default today's date
  var today = new Date();
  document.getElementById('policyIssueDate').value =
    today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

  // Close dropdown when clicking outside
  document.addEventListener('click', function(e) {
    var wrapper = document.getElementById('insurerWrapper');
    if (wrapper && !wrapper.contains(e.target)) closeInsurerDropdown();
  });

  // ── Load config then product types ─────────────────────────────────────────
  google.script.run
    .withSuccessHandler(function(config) {
      FORM_CONFIG = config;

      // Build insurer checkbox list
      var list = document.getElementById('insurerCheckboxList');
      (config.insurers || []).forEach(function(ins) {
        var row = document.createElement('label');
        row.className = 'insurer-row';
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.className = 'insurer-cb'; cb.value = ins.id;
        cb.addEventListener('change', function() {
          if (this.checked) SELECTED_INSURER_IDS[ins.id] = true;
          else delete SELECTED_INSURER_IDS[ins.id];
          updateInsurerDisplay();
        });
        var name = document.createElement('span');
        name.textContent = ins.name;
        row.appendChild(cb); row.appendChild(name);
        list.appendChild(row);
      });

      google.script.run
        .withSuccessHandler(function(types) {
          var productSel = document.getElementById('productType');
          productSel.innerHTML = '<option value="">Select Product Type</option>';
          (types || []).forEach(function(pt) {
            var opt = document.createElement('option');
            opt.value = pt; opt.textContent = pt;
            productSel.appendChild(opt);
          });
          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('mainForm').classList.remove('hidden');
        })
        .withFailureHandler(function(e) {
          document.getElementById('loadingState').innerHTML =
            '<span style="color:#c62828">Error loading products: ' + (e.message || e) + '</span>';
        })
        .getProductTypes();
    })
    .withFailureHandler(function(e) {
      document.getElementById('loadingState').innerHTML =
        '<span style="color:#c62828">Error loading configuration: ' + (e.message || e) + '</span>';
    })
    .getFormConfig();

  // ── Product Type → Sub Types ────────────────────────────────────────────────
  document.getElementById('productType').addEventListener('change', function() {
    var selectedType = this.value;
    var subTypeSel   = document.getElementById('productSubType');

    subTypeSel.innerHTML = '<option value="">Loading...</option>';
    subTypeSel.disabled  = true;

    toggleField('grpSubSubType', false);
    document.getElementById('productSubSubType').innerHTML = '<option value="">— All —</option>';
    document.getElementById('productSubSubType').value = '';

    hideAllVehicleFields();
    ['vehicleCc','vehicleGvw','vehicleSeating','yom'].forEach(function(id) {
      document.getElementById(id).value = '';
    });
    document.getElementById('fuelType').value = '';
    document.getElementById('nilDep').checked = false;
    document.getElementById('ncb').checked    = false;
    document.getElementById('vehicleAgeDisplay').textContent = '—';
    document.getElementById('vehicleAgeDisplay').style.color = '#0066cc';

    if (!selectedType) {
      subTypeSel.innerHTML = '<option value="">Select Product Type first</option>';
      return;
    }

    if (FORM_CONFIG && FORM_CONFIG.fieldConfig) {
      var fc = FORM_CONFIG.fieldConfig[selectedType] || {};
      toggleField('grpCc',         fc.cc);
      updateFuelOptions(fc.fuel);
      toggleField('grpGvw',        fc.gvw);
      toggleField('grpSeating',    fc.seating);
      toggleField('grpYom',        fc.yom);
      toggleField('grpVehicleAge', fc.yom);
      toggleField('grpNilDep',     fc.nilDep);
      toggleField('grpNcb',        fc.ncb);
    }

    google.script.run
      .withSuccessHandler(function(subTypes) {
        subTypeSel.innerHTML = '<option value="">Select Sub Type</option>';
        (subTypes || []).forEach(function(st) {
          var opt = document.createElement('option');
          opt.value = st; opt.textContent = st;
          subTypeSel.appendChild(opt);
        });
        subTypeSel.disabled = false;
      })
      .withFailureHandler(function(e) {
        subTypeSel.innerHTML = '<option value="">Error — refresh and retry</option>';
        subTypeSel.disabled  = false;
        console.error('getProductSubTypes failed:', e.message || e);
      })
      .getProductSubTypes(selectedType);
  });

  // ── Sub Type → Sub Sub Types (data-driven show/hide) ────────────────────────
  document.getElementById('productSubType').addEventListener('change', function() {
    var selectedType    = document.getElementById('productType').value;
    var selectedSubType = this.value;
    var subSubSel       = document.getElementById('productSubSubType');

    toggleField('grpSubSubType', false);
    subSubSel.innerHTML = '<option value="">— All —</option>';
    subSubSel.value     = '';

    if (!selectedSubType) return;

    google.script.run
      .withSuccessHandler(function(subSubTypes) {
        if (!subSubTypes || subSubTypes.length === 0) return;
        subSubSel.innerHTML = '<option value="">Select Sub Sub Type</option>';
        subSubTypes.forEach(function(sst) {
          var opt = document.createElement('option');
          opt.value = sst; opt.textContent = sst;
          subSubSel.appendChild(opt);
        });
        toggleField('grpSubSubType', true);
      })
      .withFailureHandler(function(e) {
        console.error('getProductSubSubTypes failed:', e.message || e);
      })
      .getProductSubSubTypes(selectedType, selectedSubType);
  });

  // ── YOM → derived vehicle age ───────────────────────────────────────────────
  document.getElementById('yom').addEventListener('input', function() {
    var yom     = parseInt(this.value);
    var display = document.getElementById('vehicleAgeDisplay');
    var curYear = new Date().getFullYear();
    if (!yom || yom < 1990 || yom > curYear + 1) {
      display.textContent = '—'; display.style.color = '#0066cc'; return;
    }
    display.textContent = yom >= curYear ? 'New' : 'Old';
    display.style.color = yom >= curYear ? '#2e7d32' : '#e65100';
  });

}); // end DOMContentLoaded

// ── Utilities ─────────────────────────────────────────────────────────────────

function toggleField(groupId, show) {
  var el = document.getElementById(groupId);
  if (el) { show ? el.classList.remove('hidden') : el.classList.add('hidden'); }
}

function hideAllVehicleFields() {
  ['grpCc','grpFuel','grpGvw','grpSeating','grpYom',
   'grpNilDep','grpNcb','grpVehicleAge'].forEach(function(id) { toggleField(id, false); });
}

// Repopulate fuel dropdown for the selected product; hide if no fuels defined
function updateFuelOptions(fuelConfig) {
  var grp = document.getElementById('grpFuel');
  var sel = document.getElementById('fuelType');
  sel.value = '';
  if (!fuelConfig || !fuelConfig.length) {
    grp.classList.add('hidden');
    return;
  }
  sel.innerHTML = '<option value="">— All Fuel Types —</option>';
  fuelConfig.forEach(function(ft) {
    var opt = document.createElement('option');
    opt.value = ft; opt.textContent = ft;
    sel.appendChild(opt);
  });
  grp.classList.remove('hidden');
}

// ── Multi-select insurer helpers ───────────────────────────────────────────────

function toggleInsurerDropdown(e) {
  e.stopPropagation();
  var dd      = document.getElementById('insurerDropdown');
  var trigger = document.getElementById('insurerTrigger');
  var isOpen  = !dd.classList.contains('hidden');
  if (isOpen) { closeInsurerDropdown(); } else {
    dd.classList.remove('hidden');
    trigger.classList.add('open');
  }
}

function closeInsurerDropdown() {
  document.getElementById('insurerDropdown').classList.add('hidden');
  document.getElementById('insurerTrigger').classList.remove('open');
}

function updateInsurerDisplay() {
  var selected = getSelectedInsurers();
  var display  = document.getElementById('insurerDisplay');
  if (selected.length === 0) {
    display.textContent = '— Select Insurer(s) —';
    display.className   = 'ms-display placeholder';
  } else if (selected.length === 1) {
    display.textContent = selected[0].name;
    display.className   = 'ms-display';
  } else {
    display.textContent = selected.length + ' insurers selected';
    display.className   = 'ms-display';
  }
}

function getSelectedInsurers() {
  var result = [];
  (FORM_CONFIG && FORM_CONFIG.insurers || []).forEach(function(ins) {
    if (SELECTED_INSURER_IDS[ins.id]) result.push(ins);
  });
  return result;
}

function selectAllInsurers() {
  (FORM_CONFIG && FORM_CONFIG.insurers || []).forEach(function(ins) {
    SELECTED_INSURER_IDS[ins.id] = true;
  });
  document.querySelectorAll('.insurer-cb').forEach(function(cb) { cb.checked = true; });
  updateInsurerDisplay();
}

function clearInsurers() {
  SELECTED_INSURER_IDS = {};
  document.querySelectorAll('.insurer-cb').forEach(function(cb) { cb.checked = false; });
  updateInsurerDisplay();
}

// ── Rate Lookup ───────────────────────────────────────────────────────────────

function doLookup() {
  var selectedInsurers = getSelectedInsurers();
  var productType      = document.getElementById('productType').value;
  var policyIssueDate  = document.getElementById('policyIssueDate').value;

  if (!selectedInsurers.length || !productType || !policyIssueDate) {
    showError('Please select at least one insurer, a product type, and policy date.');
    return;
  }

  var btn = document.getElementById('lookupBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Looking up...';

  var baseParams = {
    productType:       productType,
    productSubType:    document.getElementById('productSubType').value,
    productSubSubType: document.getElementById('productSubSubType').value,
    rto:               document.getElementById('rto').value.trim(),
    policyIssueDate:   policyIssueDate,
    fuelType:          document.getElementById('fuelType').value,
    vehicleCc:         parseFloat(document.getElementById('vehicleCc').value)      || null,
    vehicleGvw:        parseFloat(document.getElementById('vehicleGvw').value)     || null,
    vehicleSeating:    parseFloat(document.getElementById('vehicleSeating').value) || null,
    yom:               parseInt(document.getElementById('yom').value)              || null,
    nilDep:            document.getElementById('nilDep').checked ? 'Y' : '',
    ncb:               document.getElementById('ncb').checked    ? 'Y' : ''
  };

  var results = [];
  var total   = selectedInsurers.length;

  function fetchNext(idx) {
    if (idx >= total) {
      if (results.length === 1) {
        showResult(results[0].result);
      } else {
        showMultiResult(results);
      }
      btn.disabled = false; btn.innerHTML = 'Get Rate';
      return;
    }
    var ins    = selectedInsurers[idx];
    var params = {};
    for (var k in baseParams) params[k] = baseParams[k];
    params.insurerId = ins.id;

    btn.innerHTML = '<span class="spinner"></span>Looking up ' + (idx + 1) + ' / ' + total + '...';

    google.script.run
      .withSuccessHandler(function(result) {
        results.push({ insurer: ins, result: result });
        fetchNext(idx + 1);
      })
      .withFailureHandler(function(e) {
        results.push({ insurer: ins, result: { success: false, matchStatus: 'ERROR', notes: e.message || e } });
        fetchNext(idx + 1);
      })
      .lookupRate(params);
  }

  fetchNext(0);
}

// ── Result display ─────────────────────────────────────────────────────────────

function showMultiResult(results) {
  var panel  = document.getElementById('resultPanel');
  var header = document.getElementById('resultHeader');
  var grid   = document.getElementById('resultGrid');

  panel.classList.remove('hidden');
  header.className    = 'result-header pan-india';
  document.getElementById('matchBadge').className   = 'badge pan';
  document.getElementById('matchBadge').textContent = results.length + ' INSURERS';
  document.getElementById('matchLabel').textContent  = 'Rate comparison across selected insurers';
  document.getElementById('tierBadge').classList.add('hidden');
  document.getElementById('resultNotes').classList.add('hidden');

  grid.innerHTML    = '';
  grid.style.display = 'block';

  var table = document.createElement('table');
  table.className = 'comparison-table';

  var thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Insurer</th><th>Match</th><th>PO Rate (OD)</th>' +
    '<th>PO Rate (TP)</th><th>Basis</th><th>Tier</th></tr>';
  table.appendChild(thead);

  var tbody = document.createElement('tbody');
  results.forEach(function(item) {
    var r   = item.result;
    var ins = item.insurer;
    var tr  = document.createElement('tr');

    var matchText  = r.matchStatus || 'NO MATCH';
    var matchClass = 'no-match';
    if (r.success && r.matchType === 'EXACT_RTO')  { matchText = 'Exact RTO';  matchClass = 'exact'; }
    else if (r.success && r.matchType === 'PAN_INDIA') { matchText = 'Pan India'; matchClass = 'pan'; }
    else if (r.matchStatus === 'ERROR')             { matchClass = 'err'; }

    var poOD  = (r.poRate  != null)  ? '<span class="rate-chip">' + r.poRate  + '%</span>' : '—';
    var poTP  = (r.poRate2 != null)  ? '<span class="rate-chip">' + r.poRate2 + '%</span>' : '—';
    var basis = r.piOn || '—';
    var tier  = (r.gridTier && r.gridTier !== 'Base') ? r.gridTier : '—';

    tr.innerHTML = '<td><strong>' + ins.name + '</strong></td>' +
      '<td><span class="match-chip ' + matchClass + '">' + matchText + '</span></td>' +
      '<td>' + poOD + '</td>' +
      '<td>' + poTP + '</td>' +
      '<td style="font-size:12px;color:#666">' + basis + '</td>' +
      '<td style="font-size:12px">' + tier + '</td>';
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  grid.appendChild(table);
}

function showResult(r) {
  var panel  = document.getElementById('resultPanel');
  var header = document.getElementById('resultHeader');
  var badge  = document.getElementById('matchBadge');
  var label  = document.getElementById('matchLabel');
  var tier   = document.getElementById('tierBadge');
  var grid   = document.getElementById('resultGrid');
  var notes  = document.getElementById('resultNotes');

  grid.style.display = '';

  panel.classList.remove('hidden');
  header.className = 'result-header';
  grid.innerHTML = '';
  notes.classList.add('hidden');
  tier.classList.add('hidden');

  if (!r.success || r.matchStatus === 'NO_MATCH' ||
      r.matchStatus === 'ERROR' || r.matchStatus === 'MISSING_FIELD') {
    header.classList.add('no-match');
    badge.className = 'badge nomatch';
    badge.textContent = r.matchStatus || 'NO MATCH';
    label.textContent = r.notes || 'No rate found for this combination.';
    return;
  }

  if (r.matchStatus === 'DUPLICATE_RATE') {
    header.classList.add('duplicate');
    badge.className = 'badge dup';
    badge.textContent = 'DUPLICATE RATE';
    label.textContent = 'Multiple rates matched — coordinator alerted.';
    if (r.notes) addResultNote(notes, r.notes);
    return;
  }

  var isExact = r.matchType === 'EXACT_RTO';
  header.classList.add(isExact ? 'matched' : 'pan-india');
  badge.className   = 'badge ' + (isExact ? 'exact' : 'pan');
  badge.textContent = isExact ? 'EXACT RTO' : 'PAN INDIA';
  label.textContent = isExact ? 'Rate matched to exact RTO' : 'PAN India rate applied';

  if (r.gridTier && r.gridTier !== 'Base') {
    tier.classList.remove('hidden'); tier.textContent = r.gridTier;
  }

  if (r.vehicleAge) addResultRow(grid, 'Vehicle Age', r.vehicleAge, '');

  addResultRow(grid, 'Match Type', r.matchType === 'EXACT_RTO' ? 'rto_specific' : 'all_rto', '');

  if (r.poRate2 != null) {
    addResultRow(grid, 'PO Rate (OD)', r.poRate  ? r.poRate  + '%' : '—', 'amount');
    addResultRow(grid, 'PO Rate On',   r.piOn    || '—',                   '');
    addResultRow(grid, 'PO Rate (TP)', r.poRate2 ? r.poRate2 + '%' : '—', 'amount');
    addResultRow(grid, 'PO Rate On',   r.piOn2   || '—',                   '');
  } else {
    addResultRow(grid, 'PO Rate',    r.poRate ? r.poRate + '%' : '—', 'amount');
    addResultRow(grid, 'PO Rate On', r.piOn   || '—',                  '');
  }

  if (r.notes) addResultNote(notes, r.notes);
}

function addResultRow(grid, labelText, valueText, cls) {
  var item = document.createElement('div'); item.className = 'result-item';
  var lbl  = document.createElement('div'); lbl.className  = 'result-label'; lbl.textContent = labelText;
  var val  = document.createElement('div'); val.className  = 'result-value' + (cls ? ' ' + cls : ''); val.textContent = valueText;
  item.appendChild(lbl); item.appendChild(val); grid.appendChild(item);
}

function addResultNote(notesEl, text) {
  notesEl.classList.remove('hidden'); notesEl.textContent = text;
}

function showError(msg) {
  var panel  = document.getElementById('resultPanel');
  var header = document.getElementById('resultHeader');
  var badge  = document.getElementById('matchBadge');
  var grid   = document.getElementById('resultGrid');
  panel.classList.remove('hidden');
  header.className   = 'result-header error';
  badge.className    = 'badge error'; badge.textContent = 'ERROR';
  document.getElementById('matchLabel').textContent  = msg;
  grid.innerHTML     = '';
  grid.style.display = '';
  var btn = document.getElementById('lookupBtn');
  btn.disabled = false; btn.innerHTML = 'Get Rate';
}
</script>
</body>
</html>
